<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoNote</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>
<body data-theme="light">
<div id="app">
  <aside id="sidebar">
    <div class="side-tabs">
      <button data-tab="outline" class="active">大纲</button>
      <button data-tab="files">文件</button>
    </div>
    <div class="side-body">
      <div id="outline-pane" class="pane active"></div>
      <div id="files-pane" class="pane">
        <div class="files-head"><button id="btn-open-folder">打开文件夹…</button></div>
        <div id="file-tree"></div>
      </div>
    </div>
    <div class="side-foot">
      <span id="stat-chars">0 字</span>
      <span id="stat-read">—</span>
    </div>
  </aside>

  <main>
    <div id="topbar">
      <button id="btn-sidebar" title="侧栏 (⌘\)">☰</button>
      <div id="doc-title">未命名</div>
      <div class="spacer"></div>
      <span id="save-state">未保存</span>
      <button id="btn-table" title="插入表格">⊞</button>
      <button id="btn-source" title="源码模式 (⌘/)">M↓</button>
      <button id="btn-theme" title="切换主题">◐</button>
      <button id="btn-export" title="导出 HTML">⇩</button>
    </div>

    <div id="editor-scroll"><div id="write"></div></div>

    <div id="source-pane" hidden>
      <textarea id="source-area" spellcheck="false"></textarea>
    </div>

    <div id="find-bar" hidden>
      <div class="find-row">
        <input id="find-input" placeholder="查找…" autocomplete="off">
        <span id="find-count"></span>
        <button id="find-prev" title="上一个">↑</button>
        <button id="find-next" title="下一个">↓</button>
        <button id="find-close" title="关闭">✕</button>
      </div>
      <div class="find-row">
        <input id="replace-input" placeholder="替换为…" autocomplete="off">
        <button id="replace-one">替换</button>
        <button id="replace-all">全部替换</button>
      </div>
    </div>

    <div id="modal-mask" hidden>
      <div id="modal-box">
        <div id="modal-title">插入表格</div>
        <div id="modal-body"></div>
        <div id="modal-foot">
          <button id="modal-cancel">取消</button>
          <button id="modal-ok" class="primary">确定</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="vendor/hljs/highlight.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="js/parser.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
